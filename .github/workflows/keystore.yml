name: Generate signing keystore (one time)

# Run this ONCE, by hand, from the Actions tab. It mints the release signing key
# that every future APK is signed with, and hands it back as a short-lived
# artifact so it can be stored as a repo secret.
#
# The signing key must never change afterwards: Android identifies an app by its
# signature, so a new key means she can no longer install an update over the copy
# on her phone without uninstalling first (which wipes her history).
#
# This workflow is deliberately manual-only — it must never run on a push.
on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate keystore
        run: |
          PW="$(openssl rand -base64 30 | tr -d '/+=' | head -c 32)"
          keytool -genkeypair -v \
            -keystore sip-release.jks \
            -alias sip \
            -keyalg RSA -keysize 4096 -validity 10000 \
            -storepass "$PW" -keypass "$PW" \
            -dname "CN=Sip, OU=Personal, O=Sip, C=SK"
          base64 -w0 sip-release.jks > keystore.base64.txt
          printf '%s' "$PW" > keystore.password.txt
          echo "Keystore generated. Fingerprint:"
          keytool -list -v -keystore sip-release.jks -storepass "$PW" | grep -i "SHA256:"

      # retention-days is set to the minimum: the artifact holds the private
      # signing key, so it should exist for as long as it takes to copy it into
      # the repo secrets and no longer.
      - uses: actions/upload-artifact@v4
        with:
          name: sip-keystore
          path: |
            keystore.base64.txt
            keystore.password.txt
          retention-days: 1
