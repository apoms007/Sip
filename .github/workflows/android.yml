name: Build Android APK

# Builds the installable APK in the cloud so no Android SDK is needed locally.
# Grab the artifact from the run's summary page once it goes green.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # AGP 8.2 requires JDK 17.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Stage web assets
        run: node scripts/build-www.js

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: sip-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
